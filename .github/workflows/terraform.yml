name: "Vprofile IAC"
on:
  push:
    branches:
      - main
      - stage
    paths:
      - terraform/**
  pull_request:
    branches:
      - main
    paths:
      - terraform/**

env:
  # Credentials for deploying to AWS
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  # S3 bucket for Terraform state
  BUCKET_TF_STATE: ${{ secrets.BUCKET_TF_STATE }}
  AWS_REGION: us-east-1
  EKS_CLUSTER: vprofile-eks
  Terrraform_VERSION: latest
  
jobs:
  terraform:
    name: "Apply Terraform code changes"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./terraform
    steps:
        - name: Checkout source code
          uses: actions/checkout@v4

        - name: Setup Terraform
          uses: hashicorp/setup-terraform@v2
          with:
            terraform_version: ${{ env.TERRAFORM_VERSION }}
            
        - name: Terraform Init
          id: init
          run: terraform init -backend-config="bucket=$BUCKET_TF_STATE" 
 
        - name: Terraform format
          id: fmt
          run: terraform fmt -check 
    
        - name: Terraform validate
          id: validate
          run: terraform validate
        
        - name: Terraform plan
          id: plan
          run: terraform plan -out=tfplan -input=false -no-color 
          continue-on-error: true
          # continue-on-error: true is used to allow the workflow to continue even if the plan fails.
          
        
        - name: Terraform plan status
          if: steps.plan.outcome == 'failure'
          run: |
            echo "Terraform plan failed. Please check the logs for details."
            exit 1
